<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge Page Limiter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1 data-i18n="popupTitle">Page limiter</h1>
      <label class="language-field">
        <span data-i18n="languageLabel">Language</span>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <p id="status">Loading status...</p>
      <button id="openOptions" data-i18n="openOptions">Open rule settings</button>
      <button id="rescan" data-i18n="rescanCurrent">Rescan current tab</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

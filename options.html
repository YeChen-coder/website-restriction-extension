<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge Page Limiter Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1 data-i18n="appTitle">Edge Page Limiter</h1>
          <p id="summary">Only matching tabs are restricted. The browser and unrelated tabs stay open.</p>
        </div>
        <div class="topbar-actions">
          <label class="language-field">
            <span data-i18n="languageLabel">Language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="zh">中文</option>
            </select>
          </label>
          <button id="newRuleButton" class="primary" data-i18n="newRule">New rule</button>
          <button id="rescanButton" data-i18n="rescanTabs">Rescan tabs</button>
        </div>
      </header>

      <section class="layout">
        <aside class="rule-list-panel">
          <div class="panel-heading">
            <h2 data-i18n="ruleList">Rule list</h2>
            <span id="ruleCount"></span>
          </div>
          <div id="ruleList" class="rule-list"></div>
        </aside>

        <section class="editor-panel">
          <form id="ruleForm">
            <input id="ruleId" type="hidden">

            <div class="form-row switch-row">
              <label class="switch">
                <input id="enabled" type="checkbox">
                <span data-i18n="enabledRule">Enable this rule</span>
              </label>
            </div>

            <div class="form-grid">
              <label>
                <span data-i18n="nameLabel">Name</span>
                <input id="name" type="text" data-i18n-placeholder="namePlaceholder" placeholder="For example: Bilibili or ChatGPT entertainment">
              </label>

              <label>
                <span data-i18n="typeLabel">Rule type</span>
                <select id="type">
                  <option value="domain" data-i18n="domainOption">Domain rule: match the whole site</option>
                  <option value="keyword" data-i18n="keywordOption">Keyword rule: match specific pages only</option>
                </select>
              </label>

              <label>
                <span data-i18n="usageLabel">Allowed minutes</span>
                <input id="usageLimitMinutes" type="number" min="0.05" step="0.05" value="10">
              </label>

              <label>
                <span data-i18n="cooldownLabel">Lock minutes</span>
                <input id="cooldownMinutes" type="number" min="0.05" step="0.05" value="5">
              </label>

              <label>
                <span data-i18n="actionLabel">Action when time is up / locked</span>
                <select id="action">
                  <option value="close" data-i18n="closeOption">Close matching tabs</option>
                  <option value="redirect" data-i18n="redirectOption">Redirect matching tabs to blocked page</option>
                </select>
              </label>
            </div>

            <label class="wide-field">
              <span data-i18n="domainsLabel">Target domains</span>
              <textarea id="domains" rows="4" data-i18n-placeholder="domainsPlaceholder" placeholder="One per line: bilibili.com&#10;youtube.com&#10;chatgpt.com"></textarea>
            </label>

            <label class="wide-field" id="keywordsField">
              <span data-i18n="keywordsLabel">Keywords</span>
              <textarea id="keywords" rows="5" data-i18n-placeholder="keywordsPlaceholder" placeholder="One per line: game&#10;entertainment&#10;novel&#10;procrastination"></textarea>
            </label>

            <div class="hint" id="typeHint"></div>

            <div class="form-actions">
              <button type="submit" class="primary" data-i18n="saveRule">Save rule</button>
              <button type="button" id="duplicateButton" data-i18n="duplicate">Duplicate</button>
              <button type="button" id="deleteButton" class="danger" data-i18n="delete">Delete</button>
            </div>
          </form>
        </section>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge Page Limiter 设置</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Edge 页面时间锁</h1>
          <p id="summary">只限制命中的标签页，不关闭浏览器和其他标签页。</p>
        </div>
        <div class="topbar-actions">
          <button id="newRuleButton" class="primary">新建规则</button>
          <button id="rescanButton">重新检查标签页</button>
        </div>
      </header>

      <section class="layout">
        <aside class="rule-list-panel">
          <div class="panel-heading">
            <h2>规则列表</h2>
            <span id="ruleCount"></span>
          </div>
          <div id="ruleList" class="rule-list"></div>
        </aside>

        <section class="editor-panel">
          <form id="ruleForm">
            <input id="ruleId" type="hidden">

            <div class="form-row switch-row">
              <label class="switch">
                <input id="enabled" type="checkbox">
                <span>启用这条规则</span>
              </label>
            </div>

            <div class="form-grid">
              <label>
                <span>名称</span>
                <input id="name" type="text" placeholder="比如 Bilibili 或 ChatGPT 娱乐">
              </label>

              <label>
                <span>规则类型</span>
                <select id="type">
                  <option value="domain">域名规则：命中整个网站</option>
                  <option value="keyword">关键词规则：只命中特定页面</option>
                </select>
              </label>

              <label>
                <span>可运行分钟</span>
                <input id="usageLimitMinutes" type="number" min="0.05" step="0.05" value="10">
              </label>

              <label>
                <span>锁定分钟</span>
                <input id="cooldownMinutes" type="number" min="0.05" step="0.05" value="5">
              </label>

              <label>
                <span>到时间/锁定期动作</span>
                <select id="action">
                  <option value="close">关闭命中的标签页</option>
                  <option value="redirect">把命中的标签页跳到锁定页</option>
                </select>
              </label>
            </div>

            <label class="wide-field">
              <span>适用域名</span>
              <textarea id="domains" rows="4" placeholder="每行一个：bilibili.com&#10;youtube.com&#10;chatgpt.com"></textarea>
            </label>

            <label class="wide-field" id="keywordsField">
              <span>关键词</span>
              <textarea id="keywords" rows="5" placeholder="每行一个：游戏&#10;娱乐&#10;小说&#10;摸鱼"></textarea>
            </label>

            <div class="hint" id="typeHint"></div>

            <div class="form-actions">
              <button type="submit" class="primary">保存规则</button>
              <button type="button" id="duplicateButton">复制</button>
              <button type="button" id="deleteButton" class="danger">删除</button>
            </div>
          </form>
        </section>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
